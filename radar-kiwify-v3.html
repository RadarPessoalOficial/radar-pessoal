{id:33,fator:'E',invertida:true,texto:'Evito me destacar mesmo quando tenho algo importante para contribuir em um grupo.',microExplicação:'Observe seu conforto em se posicionar publicamente, distinguindo preferência de receio.',svgIcon:svg('<circle cx="60" cy="37" r="15" stroke="url(#g)" stroke-width="3"/><path d="M26 90Q30 60 60 60Q90 60 94 90" stroke="url(#g)" stroke-width="3"/><path d="M16 24L32 38M103 23L88 38" stroke="url(#g)" stroke-width="3"/>')},
{id:34,fator:'A',invertida:false,texto:'Gosto de encontrar uma solução justa quando duas pessoas têm necessidades diferentes.',microExplicação:'Explora como você tenta equilibrar interesses em situações de convivência.',svgIcon:svg('<path d="M60 20V98M31 37H89M60 30H60M31 37L19 62H43L31 37ZM89 37L77 62H101L89 37ZM36 98H84" stroke="url(#g)" stroke-width="3"/>')},
{id:35,fator:'N',invertida:true,texto:'Em situações incertas, costumo conseguir seguir em frente sem imaginar muitos cenários negativos.',microExplicação:'A última pergunta observa como você lida com a incerteza, sem tratar preocupação como defeito.',svgIcon:svg('<path d="M22 88Q34 50 60 60Q86 70 98 28" stroke="url(#g)" stroke-width="4"/><path d="M83 28H98V44" stroke="url(#g)" stroke-width="3"/>')}
];
const LABELS={O:'Abertura à experiência',C:'Conscienciosidade',E:'Extroversão',A:'Amabilidade',N:'Sensibilidade emocional'};
const EXPLAIN={
O:{low:'Você tende a valorizar métodos conhecidos e a utilidade prática das ideias.',mid:'Você parece equilibrar curiosidade e preferência por caminhos familiares.',high:'Suas respostas sugerem interesse frequente por novas ideias e experiências.'},
C:{low:'Você pode preferir improvisar e ajustar a organização conforme a necessidade.',mid:'Seu relato combina momentos de planejamento e flexibilidade.',high:'Suas respostas sugerem organização, persistência e atenção aos compromissos.'},
E:{low:'Você parece preferir ambientes mais reservados ou períodos de interação moderada.',mid:'Você relata conforto em alguns contextos sociais e reserva em outros.',high:'Suas respostas sugerem facilidade com interação e iniciativa social.'},
A:{low:'Você pode privilegiar franqueza e autonomia em situações de desacordo.',mid:'Você relata um equilíbrio entre cooperação e defesa das próprias opiniões.',high:'Suas respostas sugerem preocupação frequente com cooperação e consideração pelos outros.'},
N:{low:'Você relata maior tranquilidade diante de contratempos e pressão.',mid:'Sua reação emocional parece variar conforme o tipo de desafio.',high:'Você relata preocupações ou emoções mais intensas em situações exigentes.'}
};
const $=id=>document.getElementById(id),screen=$('screen'),card=$('card');
const STORAGE='radar-v2-progresso';
let respostas=Array(perguntas.length).fill(null),etapa='inicio',indice=0,trocaEmCurso=false;
try{const salvo=JSON.parse(localStorage.getItem(STORAGE)||'null');if(salvo&&Array.isArray(salvo.respostas)&&salvo.respostas.length===35&&salvo.respostas.every(v=>v===null||(Number.isInteger(v)&&v>=1&&v<=5))){respostas=salvo.respostas;indice=salvo.indice>=0&&salvo.indice<35?salvo.indice:0;etapa=salvo.etapa==='perguntas'?'perguntas':'inicio'}}catch(e){}
function guardar(){try{localStorage.setItem(STORAGE,JSON.stringify({respostas,indice,etapa}))}catch(e){}}
function progresso(){const n=respostas.filter(v=>v!==null).length,p=Math.round(100*n/35);$('bar').style.width=p+'%';$('percent').textContent=p+'%';$('progress').setAttribute('aria-valuenow',p);$('progressLabel').textContent=etapa==='inicio'?'Conheça seu Radar':etapa==='perguntas'?`Pergunta ${indice+1} de 35`:'Seu Radar está pronto'}
function animar(fn){if(reduced){fn();return}card.classList.add('out');setTimeout(()=>{fn();card.classList.remove('out');card.classList.add('in');requestAnimationFrame(()=>card.classList.remove('in'))},200)}
function textoSeguro(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function iniciar(){etapa='perguntas';indice=respostas.findIndex(x=>x===null);if(indice<0)indice=0;guardar();render()}
function render(){progresso();screen.classList.remove('reveal');void screen.offsetWidth;screen.classList.add('reveal');
if(etapa==='inicio'){const feitos=respostas.filter(v=>v!==null).length;screen.innerHTML=`<p class="eyebrow">AUTOCONHECIMENTO · CINCO DIMENSÕES</p><div class="art" aria-hidden="true">${art.orbit}</div><h1>Você se conhece além do óbvio?</h1><p class="muted">Explore suas tendências com 35 afirmações do cotidiano, em um questionário educativo inspirado no modelo Big Five.</p><div class="micro">Cerca de 5 a 7 minutos · 35 respostas · Prévia gratuita · Sem diagnóstico</div><button class="primary grow" style="width:100%" id="start">${feitos?'Continuar meu Radar':'Começar meu Radar →'}</button><p class="fine" style="text-align:left">As respostas ficam apenas neste navegador. Este questionário autoral não passou por validação psicométrica específica.</p>`;$('start').addEventListener('click',()=>animar(iniciar));return}
if(etapa==='perguntas'){const q=perguntas[indice];screen.innerHTML=`<p class="eyebrow">${textoSeguro(LABELS[q.fator])} · ${indice+1}/35</p><div class="art">${q.svgIcon}</div><h2>${textoSeguro(q.texto)}</h2><p class="muted" style="font-size:14px">Responda pensando em como você costuma agir, não em um dia excepcional.</p><div class="choices" role="group" aria-label="Grau de concordância">${['Discordo totalmente','Discordo','Nem concordo nem discordo','Concordo','Concordo totalmente'].map((t,i)=>`<button type="button" class="choice ${respostas[indice]===i+1?'selected':''}" data-answer="${i+1}" aria-pressed="${respostas[indice]===i+1}"><span class="dot" aria-hidden="true"></span><span>${t}</span></button>`).join('')}</div><p class="micro"><strong>Por que perguntamos?</strong> ${textoSeguro(q.microExplicação)}</p><div class="actions"><button class="secondary" id="back">← Voltar</button><button class="secondary grow" id="next" ${respostas[indice]===null?'disabled':''}>${indice===34?'Ver meu resumo':'Próxima →'}</button></div>`;
  screen.querySelectorAll('[data-answer]').forEach(b=>b.addEventListener('click',()=>{if(trocaEmCurso)return;const v=Number(b.dataset.answer);respostas[indice]=v;pop();guardar();screen.querySelectorAll('[data-answer]').forEach(x=>{x.classList.toggle('selected',x===b);x.setAttribute('aria-pressed',x===b?'true':'false')});$('next').disabled=false;trocaEmCurso=true;setTimeout(()=>{trocaEmCurso=false;avancar()},reduced?0:220)}));
  $('back').addEventListener('click',()=>{if(indice===0){etapa='inicio'}else indice--;guardar();animar(render)});
  $('next').addEventListener('click',avancar);return}
if(etapa==='calculando'){screen.innerHTML=`<p class="eyebrow">ORGANIZANDO SUAS RESPOSTAS</p><div class="art" aria-hidden="true">${art.orbit}</div><h2>Seu mapa está ficando pronto</h2><p class="muted">Estamos calculando as pontuações internas das cinco dimensões. Não estamos comparando você a uma média nacional.</p>`;return}
if(etapa==='resumo')renderResumo();}
function avancar(){if(respostas[indice]===null)return;if(indice<34){indice++;guardar();animar(render);return}if(respostas.some(v=>v===null)){indice=respostas.findIndex(v=>v===null);guardar();render();return}etapa='calculando';guardar();animar(render);setTimeout(()=>{etapa='resumo';guardar();animar(render)},reduced?150:550)}
function pontuacoes(){const mapa={O:[],C:[],E:[],A:[],N:[]};perguntas.forEach((q,i)=>{if(!Number.isInteger(respostas[i])||respostas[i]<1||respostas[i]>5)throw Error('Resposta faltando');mapa[q.fator].push(q.invertida?6-respostas[i]:respostas[i])});const notas={};for(const f of Object.keys(mapa)){if(mapa[f].length!==7)throw Error('Quantidade de itens incorreta: '+f);notas[f]=Math.round(((mapa[f].reduce((a,b)=>a+b,0)-7)/28)*100)}return notas}
function faixa(v){return v<=33?'low':v>=67?'high':'mid'}
function renderResumo(){let notas;try{notas=pontuacoes()}catch(e){etapa='perguntas';indice=respostas.findIndex(v=>v===null);if(indice<0)indice=0;return render()}const ordem=Object.keys(notas).sort((a,b)=>notas[b]-notas[a]);const top=ordem[0],empate=notas[ordem[0]]-notas[ordem[1]]<=4;
const cards=ordem.map((f,i)=>`<div class="resultRow ${i?'locked':''}"><span>${textoSeguro(LABELS[f])}</span><strong>${i?'<span aria-label="Detalhes na análise completa">◌</span>':notas[f]+'/100'}</strong></div>`).join('');
screen.innerHTML=`<p class="eyebrow">SUA PRÉVIA GRATUITA</p><div class="art" aria-hidden="true">${art.compass}</div><h1>Seu Radar está pronto.</h1><p class="muted">Você concluiu as 35 perguntas. Esta é uma amostra do seu perfil, baseada nas suas próprias respostas.</p><div class="highlight"><div class="eyebrow">${empate?'Destaque entre fatores próximos':'Dimensão com maior pontuação interna'}</div><h2 style="margin-bottom:0">${textoSeguro(LABELS[top])}</h2><div class="score">${notas[top]}/100</div><p>${textoSeguro(EXPLAIN[top][faixa(notas[top])])}</p></div><p class="fine" style="text-align:left">Pontuações normalizadas do questionário, <strong>não</strong> percentis nem avaliações clínicas. ${empate?'As duas maiores pontuações estão próximas; não há um traço claramente dominante.':''}</p><h3>Seu mapa das cinco dimensões</h3><div class="results">${cards}</div><p class="muted" style="font-size:14px">As outras dimensões foram calculadas. Você pode copiar suas cinco pontuações no botão abaixo; por enquanto, a compra oferece apenas o guia educativo em PDF, sem relatório personalizado.</p><div class="offer"><p class="eyebrow">GUIA PREMIUM DISPONÍVEL NA KIWIFY</p><h2>Entenda o Big Five em profundidade</h2><p class="muted">O material atualmente entregue pela Kiwify é o guia educativo geral de autoconhecimento em PDF. Ele não contém a interpretação personalizada dessas 35 respostas.</p><div class="actions"><a class="primary grow paylink" id="buy" href="https://pay.kiwify.com.br/kEA2VDn" rel="noopener noreferrer">Adquirir o guia em PDF · R$ 9,90</a></div><p class="fine" style="text-align:left">Pagamento pela Kiwify. Após a aprovação, as instruções de acesso ao guia PDF são enviadas ao e-mail informado na compra. Este produto não libera um relatório individual neste site.</p></div><div class="actions"><button class="secondary grow" id="restart">Refazer questionário</button><button class="secondary grow" id="share">Copiar meu resumo</button></div>`;

$('restart').addEventListener('click',()=>{if(!confirm('Deseja apagar as respostas deste navegador e recomeçar?'))return;respostas=Array(35).fill(null);indice=0;etapa='inicio';guardar();animar(render)});
$('share').addEventListener('click',async()=>{const t='Meu RADAR PESSOAL: '+ordem.map(f=>`${LABELS[f]} ${notas[f]}/100`).join(' | ')+' · Questionário educativo autoral, não diagnóstico.';try{await navigator.clipboard.writeText(t);$('share').textContent='Resumo copiado!'}catch(e){window.prompt('Copie seu resumo:',t)}})}
</script>
<style>
.resultRow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid #ffffff22}.locked{color:#8e98b8;filter:blur(2px);user-select:none}.highlight{border:1px solid #9172ff66;background:linear-gradient(135deg,#7b4cff22,#40b9f511);padding:22px;border-radius:20px;margin:24px 0}.highlight p{margin-bottom:0}.score{font-size:46px;font-weight:900;letter-spacing:-.05em;color:#70dbff}.offer{padding:20px;border:1px solid #ffffff36;border-radius:22px;background:#ffffff08;margin:26px 0}.offer h2{font-size:25px}.results{margin:14px 0 20px}.actions button{min-width:48px}.choices button{min-width:48px}h3{font-size:21px;line-height:1.3}
</style>
<script>
render();
</script>
</body>
